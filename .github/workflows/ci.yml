name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag_test_only
          POSTGRES_DB: agentic_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d agentic_rag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rag:rag_test_only@127.0.0.1:5432/agentic_rag_test
      UI_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned application and test dependencies
        run: python -m pip install -c requirements.lock -e '.[dev,browser-tests]'
      - run: python -m pip check
      - name: Unit, HTTP, graph, and PostgreSQL tests
        run: python -m pytest -q
      - name: Real-browser workflows with deterministic model adapters
        run: python tests/ui_browser_check.py
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/wheels .

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application container
        run: docker build --tag agentic-rag-assistant:ci .
      - name: Verify runtime dependencies and non-root execution
        run: |
          docker run --rm agentic-rag-assistant:ci python -m pip check
          docker run --rm agentic-rag-assistant:ci python -c "import os; assert os.getuid() != 0"
